server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws:; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'";
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
  location /ws {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}
